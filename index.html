<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tải ảnh lên</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="upload-card">
      <h1>Tải ảnh lên</h1>
      <p>Chọn hoặc kéo ảnh vào khung bên dưới.</p>

      <label class="drop-zone" id="dropZone" for="imageInput">
        <span class="upload-icon" aria-hidden="true">↑</span>
        <strong>Chọn ảnh</strong>
        <small>PNG, JPG, WEBP</small>
      </label>
      <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" />

      <section class="preview" id="preview" hidden>
        <img id="previewImage" alt="Ảnh đã chọn" />
        <div class="file-info">
          <span id="fileName"></span>
          <button id="removeButton" type="button">Xóa ảnh</button>
        </div>
      </section>

      <p class="message" id="message" role="status"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
